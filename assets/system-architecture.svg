<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">FPV Simulator Car system architecture</title>
  <desc id="desc">One 1S Li-ion battery supplies the TB6612 motor driver and two motors. A separate 1S LiPo feeds a TPS61023 boost module, which supplies 5 volts to the ESP32-CAM. The ESP32-CAM provides 3.3 volt driver logic and four GPIO control signals. Grounds are shared.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff866e" stroke-width="2"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66d5eb" stroke-width="2"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd9cff" stroke-width="2"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .title { fill: #f5f8ff; font-size: 28px; font-weight: 750; }
      .subtitle { fill: #9caec7; font-size: 14px; }
      .section { fill: #9caec7; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .name { fill: #f5f8ff; font-size: 19px; font-weight: 700; }
      .detail { fill: #b9c8dc; font-size: 13px; }
      .pathlabel { font-size: 13px; font-weight: 700; }
      .card { fill: #1b2b42; stroke: #36516b; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#101b2d"/>
  <text class="title" x="42" y="56">Two batteries. One shared reference.</text>
  <text class="subtitle" x="42" y="82">Planned wiring architecture · modules and connections are shown conceptually</text>

  <text class="section" x="42" y="132">MOTOR POWER</text>
  <rect class="card" x="42" y="150" width="198" height="100" rx="14"/>
  <text class="name" x="61" y="190">1S Li-ion</text><text class="detail" x="61" y="216">motor battery · BT1</text>
  <rect class="card" x="360" y="150" width="244" height="100" rx="14"/>
  <text class="name" x="379" y="187">TB6612FNG</text><text class="detail" x="379" y="212">VM + logic inputs</text>
  <rect class="card" x="753" y="140" width="212" height="58" rx="12"/>
  <text class="name" x="771" y="177">Rear drive motor</text>
  <rect class="card" x="753" y="209" width="212" height="58" rx="12"/>
  <text class="name" x="771" y="246">Steering motor</text>
  <path d="M240 200 H360" stroke="#ff866e" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <text class="pathlabel" x="260" y="185" fill="#ff866e">SW1A → VM</text>
  <path d="M604 170 H753 M604 231 H753" stroke="#ff866e" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <text class="detail" x="640" y="155">AO1 / AO2</text><text class="detail" x="640" y="220">BO1 / BO2</text>

  <text class="section" x="42" y="312">CAMERA + CONTROL POWER</text>
  <rect class="card" x="42" y="330" width="198" height="104" rx="14"/>
  <text class="name" x="61" y="370">1S LiPo</text><text class="detail" x="61" y="397">camera battery · BT2</text>
  <rect class="card" x="360" y="330" width="244" height="104" rx="14"/>
  <text class="name" x="379" y="368">TPS61023 module</text><text class="detail" x="379" y="395">boost + capacitors on perfboard</text>
  <rect class="card" x="753" y="330" width="212" height="104" rx="14"/>
  <text class="name" x="771" y="368">ESP32-CAM</text><text class="detail" x="771" y="395">Wi-Fi browser control</text>
  <path d="M240 382 H360" stroke="#66d5eb" stroke-width="3" fill="none" marker-end="url(#arrow-cyan)"/>
  <text class="pathlabel" x="248" y="366" fill="#66d5eb">SW1B → VIN</text>
  <path d="M604 382 H753" stroke="#66d5eb" stroke-width="3" fill="none" marker-end="url(#arrow-cyan)"/>
  <text class="pathlabel" x="643" y="366" fill="#66d5eb">5 V OUT</text>

  <path d="M861 330 V287 H485 V250" stroke="#bd9cff" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow-violet)"/>
  <rect x="987" y="303" width="175" height="116" rx="13" fill="#27324b" stroke="#695e94"/>
  <text class="pathlabel" x="1004" y="333" fill="#d3beff">ESP → driver</text>
  <text class="detail" x="1004" y="358">3.3 V logic + enable</text>
  <text class="detail" x="1004" y="382">GPIO12–15 direction</text>
  <text class="detail" x="1004" y="403">and PWM signals</text>
  <path d="M965 382 H987" stroke="#bd9cff" stroke-width="2.5" fill="none" marker-end="url(#arrow-violet)"/>

  <line x1="42" y1="496" x2="1158" y2="496" stroke="#768ba7" stroke-width="2"/>
  <path d="M141 434 V496 M477 434 V496 M858 434 V496" stroke="#768ba7" stroke-width="2" fill="none"/>
  <text class="pathlabel" x="43" y="524" fill="#b9c8dc">COMMON GROUND</text>
  <text class="subtitle" x="220" y="524">BT1− · BT2− · boost GND · ESP GND · motor-driver GND</text>
</svg>
